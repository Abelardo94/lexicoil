# Content validation CI (lexiloop v9)
#
# FAIL build when:
#   - validate-exam-fidelity reports errors on availability.status=live levels
#   - cross-exam passage duplicates on live levels
#   - any test:engine script fails
#
# beta / hidden levels: reported as [beta — report only], exit 0

name: Content validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  content-validation:
    name: ci:content + test:engine
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Before ci:content on purpose. ci:content currently fails on de/* live
      # fidelity, and `&&` would mean this gate never runs at all — a green from
      # not executing, which is the failure this gate exists to prevent.
      - name: test:spelling-gate (el gate se prueba saboteado)
        run: npm run test:spelling-gate

      - name: audit:spelling:en (Cambridge es examen britanico)
        run: npm run audit:spelling:en

      - name: test:duplicate-options-gate (el gate se prueba saboteado)
        run: npm run test:duplicate-options-gate

      - name: audit:duplicate-options (dos opciones iguales = item sin respuesta)
        run: npm run audit:duplicate-options

      - name: test:open-cloze-gate (el gate se prueba saboteado)
        run: npm run test:open-cloze-gate

      - name: audit:open-cloze:en (Part 6 solo gapea palabras funcionales)
        run: npm run audit:open-cloze:en

      - name: test:placeholders-gate (el gate se prueba saboteado)
        run: npm run test:placeholders-gate

      # Cubre los dos idiomas: el defecto era alemán, pero el pipeline es común.
      - name: audit:placeholders (basura de plantilla en contenido servido)
        run: npm run audit:placeholders

      - name: ci:content (live fidelity + dedupe gate)
        run: npm run ci:content

      - name: test:engine
        run: npm run test:engine

  pre-build-guard-smoke:
    name: pre-build-guard (dry-run smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: content-validation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: pre-build-guard dry-run de/B1
        run: node scripts/pre-build-guard.mjs --lang de --level B1 --dry-run
